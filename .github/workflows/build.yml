name: Build

# Nothing here publishes on its own. Run it from the Actions tab:
#
#   - Leave "version" empty -> just builds and attaches the zip as a workflow
#                              artifact, so you can test a change.
#   - Set "version" (v1.0)  -> additionally creates a DRAFT release with the
#                              zip attached. You write the description and
#                              press Publish yourself.
#
# A draft release does not create its git tag until you publish it, so nothing
# is tagged and nothing is public until you say so.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for a draft release (e.g. v1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  # The SDK is Laminar's and is not vendored here (see LICENSE), so each job
  # fetches it. Bump when a newer SDK is required; the source needs XPLM440+.
  SDK_URL: https://www.x-plane.com/wp-content/uploads/2026/09/XPSDK440b1.zip
  SDK_VERSION: '440'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch X-Plane SDK
        run: bash .github/fetch-sdk.sh
      - name: Build
        run: |
          export XPLANE_SDK_DIR="$PWD/SDK"
          cmake -S . -B build -DSDK_VERSION=$SDK_VERSION -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: lin_x64
          path: build/lin_x64/VolumeDeck.xpl
          if-no-files-found: error

  windows:
    # Cross-compiled from Linux with MinGW-w64, matching toolchain-win.cmake.
    # The WIN32 branch of CMakeLists.txt passes GCC-style link flags, so MSVC
    # is not an option here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64-x86-64
      - name: Fetch X-Plane SDK
        run: bash .github/fetch-sdk.sh
      - name: Build
        run: |
          export XPLANE_SDK_DIR="$PWD/SDK"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=toolchain-win.cmake \
            -DSDK_VERSION=$SDK_VERSION -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Check the binary has no runtime DLL dependencies
        run: |
          sudo apt-get install -y binutils-mingw-w64-x86-64
          x86_64-w64-mingw32-objdump -p build/win_x64/VolumeDeck.xpl | grep 'DLL Name'
          if x86_64-w64-mingw32-objdump -p build/win_x64/VolumeDeck.xpl \
               | grep -qiE 'libstdc\+\+|libgcc'; then
            echo "::error::static link flags were dropped - plugin would fail to load"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: win_x64
          path: build/win_x64/VolumeDeck.xpl
          if-no-files-found: error

  macos:
    # Native universal build. Never verified in the sim by a human - see README.
    # Allowed to fail so an untested toolchain cannot block a build.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Fetch X-Plane SDK
        run: bash .github/fetch-sdk.sh
      - name: Build universal binary
        run: |
          export XPLANE_SDK_DIR="$PWD/SDK"
          cmake -S . -B build \
            -DSDK_VERSION=$SDK_VERSION -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          lipo -info build/mac_x64/VolumeDeck.xpl || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac_x64
          path: build/mac_x64/VolumeDeck.xpl
          if-no-files-found: error

  package:
    needs: [linux, windows, macos]
    if: always() && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble the X-Plane plugin folder
        id: pkg
        env:
          VERSION: ${{ inputs.version }}
        run: |
          LABEL="${VERSION:-$(git rev-parse --short HEAD)}"
          PKG=VolumeDeck
          mkdir -p "dist/$PKG"
          for plat in lin_x64 win_x64 mac_x64; do
            if [ -f "artifacts/$plat/VolumeDeck.xpl" ]; then
              mkdir -p "dist/$PKG/$plat"
              cp "artifacts/$plat/VolumeDeck.xpl" "dist/$PKG/$plat/"
              echo "included $plat"
            else
              echo "::warning::$plat missing from this build"
            fi
          done
          cp README.md LICENSE "dist/$PKG/"
          cd dist
          ZIP="VolumeDeck-${LABEL}-XPlane.zip"
          zip -qr "$ZIP" "$PKG"
          echo "zip=dist/$ZIP" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          unzip -l "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeDeck-package
          path: ${{ steps.pkg.outputs.zip }}

      # Draft only. The tag is not created and nothing is visible publicly
      # until you edit the description and press Publish on the Releases page.
      - name: Create draft release
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          {
            echo "_Draft - replace this with your own description before publishing._"
            echo
            echo "## Install"
            echo
            echo "1. Download the zip below and unzip it."
            echo "2. Copy the VolumeDeck folder into X-Plane 12/Resources/plugins/"
            echo "3. Start X-Plane. The speaker icon appears in the upper right corner."
            echo
            echo "Requires X-Plane 12.4.4 or newer (built against SDK 4.4.0)."
            echo
            echo "## Included builds"
            echo
            for plat in lin_x64 win_x64 mac_x64; do
              if unzip -l "$ZIP" | grep -q "$plat/VolumeDeck.xpl"; then
                echo "- $plat"
              else
                echo "- $plat (not included in this build)"
              fi
            done
          } > notes.md
          gh release create "$VERSION" "$ZIP" --draft --target "$GITHUB_SHA" --title "VolumeDeck $VERSION" --notes-file notes.md
          echo "Draft created - edit and publish it here:"
          gh release view "$VERSION" --json url --jq .url
